name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: 密钥扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 全历史扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装依赖
        working-directory: server
        run: npm ci
      - name: 后端语法检查
        working-directory: server
        run: |
          node --check server.js
          node --check app.js
          for f in src/*.js src/routes/*.js src/providers/*.js src/lib/*.js src/schemas/*.js src/services/*.js scripts/*.js; do
            node --check "$f"
          done
      - name: 后端依赖漏洞审计（高危阻断）
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true # 上游公告波动不阻断 CI，日志留痕
      - name: 后端测试（Vitest + supertest）
        # T20: 固定 forks + maxForks=2（默认并行 fork 偶发 Worker exited unexpectedly）
        working-directory: server
        run: npx vitest run --pool=forks --poolOptions.forks.maxForks=2
      - name: 后端 Lint（eslint，P0.4）
        working-directory: server
        run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖
        working-directory: app
        run: npm ci
      - name: 前端构建（Vite 构建即语法门禁）
        working-directory: app
        run: npm run build
      - name: 构建产物冒烟（singlefile + CSP 存在性）
        working-directory: app
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/index.html';
            if (!fs.existsSync(p)) { console.error('dist/index.html 缺失'); process.exit(1); }
            const html = fs.readFileSync(p, 'utf8');
            if (!/<meta[^>]*Content-Security-Policy/i.test(html)) { console.error('CSP meta 缺失'); process.exit(1); }
            if (/javascript:/i.test(html)) { console.error('产物含 javascript: 伪协议'); process.exit(1); }
            console.log('dist smoke OK, size=' + (html.length / 1024).toFixed(0) + 'KB');
          "
      - name: 游戏门户产物冒烟（清单 × dist 一一对应）
        working-directory: app
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { GAMES } from './src/services/gamesManifest.js';
            const missing = [];
            if (!fs.existsSync('dist/games/index.html')) missing.push('dist/games/index.html');
            for (const g of GAMES) {
              if (!fs.existsSync('dist/' + g.src)) missing.push('dist/' + g.src);
            }
            if (missing.length) { console.error('游戏产物缺失: ' + missing.join(', ')); process.exit(1); }
            console.log('games smoke OK: ' + GAMES.length + ' games');
          "
      - name: 前端依赖漏洞审计（高危阻断）
        working-directory: app
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: 前端服务层单测
        working-directory: app
        run: npx vitest run
      - name: 前端 Lint（eslint，P0.4）
        working-directory: app
        run: npm run lint
  tooling:
    name: 发布工具测试（零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查 + node:test（scripts/）
        run: |
          node --check scripts/installer-lib.js
          node --check scripts/publish-installer.js
          node --test scripts/installer-lib.test.js

  desktop-core:
    name: 桌面端更新工具测试（node:test，无 Electron 依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 主进程语法检查
        run: |
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check desktop/updater.js
          node --check desktop/updater-util.js
      - name: updater 纯函数单测（feed/required/撤回/下载参数校验）
        run: node --test desktop/test/updater.test.js