# 插入 /etc/nginx/sites-available/qbao 的 server 块（放在 "location / {" 之前）；
# 三段前缀互不重叠，nginx 按最长前缀匹配：
#   静态页   ^~ /games/werewolf/             → 磁盘文件 + 子路径 SPA 回退
#   HTTP API ^~ /games/werewolf/api/         → 剥前缀转发 127.0.0.1:3011
#   WebSocket ^~ /games/werewolf/werewolf-ws → 原样透传 127.0.0.1:3011（含 Upgrade 头）

    location ^~ /games/werewolf/werewolf-ws {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location ^~ /games/werewolf/api/ {
        proxy_pass http://127.0.0.1:3011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /games/werewolf/ {
        try_files $uri $uri/ /games/werewolf/index.html;
    }
