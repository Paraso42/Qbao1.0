<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>俄罗斯轮盘 · Qbao 游戏空间</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo"><span class="pad">🎰</span> 俄罗斯轮盘</div>
  <div class="hud">
    <span id="who" class="who">加载中…</span>
    <span class="pill" id="bal">余额 --</span>
  </div>
</header>

<p class="demo-note" id="demoNote" style="display:none">
  演示模式：虚拟 <b>500</b> 分试玩，不落库不进账。登录 Qbao 后赢取真实积分。
  <a href="../index.html">去登录 / 返回游戏空间</a>
</p>

<main>
  <section class="card wheel-card">
    <div class="wheel-wrap">
      <canvas id="wheel" width="720" height="720"></canvas>
      <div class="led" id="led">—</div>
    </div>
    <div class="wheel-info" id="wheelInfo">先选注，再开始转盘；结果由服务器裁决</div>
  </section>

  <section class="card bet-card">
    <div class="sec-title">① 下注金额</div>
    <div class="amount-row">
      <input id="amount" type="number" min="1" max="100000" value="10" inputmode="numeric">
      <div class="chips">
        <button data-v="1">1</button><button data-v="5">5</button><button data-v="10">10</button>
        <button data-v="25">25</button><button data-v="50">50</button><button data-v="max">全部</button>
      </div>
    </div>

    <div class="sec-title">② 选颜色 · 选奇偶（可双选）</div>
    <div class="pick-row" id="colorRow">
      <button class="pick red" data-pick="color" data-value="red">红</button>
      <button class="pick black" data-pick="color" data-value="black">黑</button>
      <span class="pick-hint">红色/黑色 ×2</span>
    </div>
    <div class="pick-row" id="parityRow">
      <button class="pick odd" data-pick="parity" data-value="odd">奇</button>
      <button class="pick even" data-pick="parity" data-value="even">偶</button>
      <span class="pick-hint">奇数/偶数 ×2 · 双选组合 ×4</span>
    </div>
    <div class="pick-row">
      <button class="pick green" id="greenBtn">绿 <small>(0)</small></button>
      <span class="pick-hint">绿色 ×35，与颜色/奇偶互不影响</span>
    </div>
    <button id="addSpot" class="add-btn" disabled>+ 加入注单（1 注 = 当前双选组合）</button>

    <div class="sec-title">③ 本轮注单</div>
    <ul id="spots" class="spots"><li class="empty">还没有注位</li></ul>
    <div class="summary">
      <span>总注：<b id="total">0</b></span>
      <span class="muted" id="capNote"></span>
    </div>
    <button id="spin" class="spin-btn" disabled>开始转盘</button>
    <p class="tip">开始后不可取消 · 结果由服务器裁决 · 命中按倍率返还包括本金</p>
  </section>
</main>

<div id="resultOverlay" class="overlay" style="display:none">
  <div class="card result-card">
    <div class="rc-number" id="rcNumber">—</div>
    <div class="rc-color" id="rcColor">—</div>
    <div class="rc-bets" id="rcBets"></div>
    <div class="rc-payout" id="rcPayout">—</div>
    <div class="rc-balance" id="rcBalance"></div>
    <button id="rcAgain" class="spin-btn">再来一轮</button>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>window.__QBAO_GAME_ID__ = 'roulette';</script>
<script src="../common/qbao-hook.js"></script>
<script src="roulette.js"></script>
</body>
</html>
